<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #2c3e50, #3498db);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
.card {
  background: white;
  padding: 40px 35px;
  border-radius: 16px;
  width: 360px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.3);
}
h2 { text-align: center; color: #2c3e50; margin-bottom: 8px; font-size: 22px; }
.subtitle { text-align: center; color: #7f8c8d; font-size: 13px; margin-bottom: 28px; }
label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; font-weight: bold; }
input {
  width: 100%; padding: 11px 14px; border: 1.5px solid #ddd;
  border-radius: 8px; font-size: 15px; margin-bottom: 18px;
  outline: none; transition: border 0.2s;
}
input:focus { border-color: #3498db; }
button {
  width: 100%; padding: 13px; background: #2c3e50; color: white;
  border: none; border-radius: 8px; font-size: 16px; font-weight: bold;
  cursor: pointer; transition: background 0.2s;
}
button:hover { background: #3498db; }
.error {
  background: #fde8e8; color: #e74c3c; padding: 10px 14px;
  border-radius: 8px; font-size: 13px; margin-bottom: 15px;
  display: none; text-align: center;
}
.loading { opacity: 0.6; pointer-events: none; }
</style>
</head>
<body>
<div class="card">
  <h2>🔐 Đăng nhập</h2>
  <p class="subtitle">Hệ thống điều khiển Relay</p>
  <div class="error" id="errMsg"></div>
  <label>Tên tài khoản</label>
  <input type="text" id="username" placeholder="Nhập tài khoản" autofocus>
  <label>Mật khẩu</label>
  <input type="password" id="password" placeholder="Nhập mật khẩu">
  <button id="btnLogin">Đăng nhập</button>
</div>

<script>
async function doLogin() {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const errMsg   = document.getElementById("errMsg");
  const btn      = document.getElementById("btnLogin");

  if (!username || !password) {
    errMsg.textContent = "Vui lòng nhập đầy đủ thông tin!";
    errMsg.style.display = "block";
    return;
  }

  btn.textContent = "Đang đăng nhập...";
  btn.classList.add("loading");

  try {
    const res  = await fetch("/api/login", {
      method:  "POST",
      headers: { "Content-Type": "application/json" },
      body:    JSON.stringify({ username, password })
    });
    const data = await res.json();

    if (data.ok) {
      localStorage.setItem("token",    data.token);
      localStorage.setItem("username", data.username);
      localStorage.setItem("role",     data.role);
      window.location.href = "/app?token=" + data.token;
    } else {
      errMsg.textContent = data.message || "Sai thông tin đăng nhập!";
      errMsg.style.display = "block";
      btn.textContent = "Đăng nhập";
      btn.classList.remove("loading");
    }
  } catch (e) {
    errMsg.textContent = "Không kết nối được server!";
    errMsg.style.display = "block";
    btn.textContent = "Đăng nhập";
    btn.classList.remove("loading");
  }
}

document.getElementById("btnLogin").addEventListener("click", doLogin);
document.addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Đăng nhập</title>
<style>
  :root {
    --bg:      #0d1117;
    --surface: #161b22;
    --border:  #30363d;
    --accent:  #f0883e;
    --green:   #3fb950;
    --red:     #f85149;
    --text:    #e6edf3;
    --muted:   #8b949e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', Courier, monospace;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  /* subtle grid bg */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.25;
    pointer-events: none;
  }

  .logo {
    font-size: clamp(11px, 2.5vw, 13px);
    letter-spacing: 0.2em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 28px;
    text-align: center;
  }

  .logo span {
    display: block;
    font-size: clamp(20px, 5vw, 28px);
    letter-spacing: 0.08em;
    font-weight: 700;
    color: var(--text);
    margin-top: 4px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: clamp(24px, 5vw, 36px);
    width: 100%;
    max-width: 380px;
    position: relative;
    z-index: 1;
  }

  /* top accent line */
  .card::before {
    content: '';
    position: absolute;
    top: -1px; left: 20%; right: 20%;
    height: 2px;
    background: var(--accent);
    border-radius: 0 0 4px 4px;
  }

  .card-title {
    font-size: 13px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 24px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  .error {
    font-size: 12px;
    padding: 9px 12px;
    border-radius: 7px;
    margin-bottom: 16px;
    display: none;
    background: rgba(248,81,73,.1);
    border: 1px solid rgba(248,81,73,.35);
    color: var(--red);
    letter-spacing: 0.03em;
  }
  .error.show { display: block; }

  .field { margin-bottom: 16px; }

  label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.14em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 10px 13px;
    outline: none;
    transition: border-color .15s;
  }
  input::placeholder { color: var(--muted); }
  input:focus { border-color: var(--accent); }

  .btn-login {
    margin-top: 8px;
    width: 100%;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 12px;
    border-radius: 7px;
    border: 1px solid var(--accent);
    background: rgba(240,136,62,.12);
    color: var(--accent);
    cursor: pointer;
    transition: all .15s;
    touch-action: manipulation;
  }
  .btn-login:hover  { background: rgba(240,136,62,.22); }
  .btn-login:active { transform: scale(.98); }
  .btn-login.loading { opacity: .5; pointer-events: none; }
</style>
</head>
<body>

<div class="logo">
  Hệ thống điều khiển
  <span>⚡ RELAY</span>
</div>

<div class="card">
  <div class="card-title">🔐 Xác thực tài khoản</div>

  <div class="error" id="errMsg"></div>

  <div class="field">
    <label>Tên tài khoản</label>
    <input type="text" id="username" placeholder="Nhập tài khoản" autofocus autocomplete="username">
  </div>

  <div class="field">
    <label>Mật khẩu</label>
    <input type="password" id="password" placeholder="Nhập mật khẩu" autocomplete="current-password">
  </div>

  <button class="btn-login" id="btnLogin">Đăng nhập</button>
</div>

<script>
async function doLogin() {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const errMsg   = document.getElementById("errMsg");
  const btn      = document.getElementById("btnLogin");

  errMsg.classList.remove("show");

  if (!username || !password) {
    errMsg.textContent = "Vui lòng nhập đầy đủ thông tin!";
    errMsg.classList.add("show");
    return;
  }

  btn.textContent = "Đang xác thực...";
  btn.classList.add("loading");

  try {
    const res  = await fetch("/api/login", {
      method:  "POST",
      headers: { "Content-Type": "application/json" },
      body:    JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (data.ok) {
      localStorage.setItem("token",    data.token);
      localStorage.setItem("username", data.username);
      localStorage.setItem("role",     data.role);
      window.location.href = "/app?token=" + data.token;
    } else {
      errMsg.textContent = data.message || "Sai thông tin đăng nhập!";
      errMsg.classList.add("show");
      btn.textContent = "Đăng nhập";
      btn.classList.remove("loading");
    }
  } catch (e) {
    errMsg.textContent = "Không kết nối được server!";
    errMsg.classList.add("show");
    btn.textContent = "Đăng nhập";
    btn.classList.remove("loading");
  }
}

document.getElementById("btnLogin").addEventListener("click", doLogin);
document.addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
</script>
</body>
</html>

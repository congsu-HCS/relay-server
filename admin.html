<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quản lý User</title>
<style>
  :root {
    --bg:      #0d1117;
    --surface: #161b22;
    --border:  #30363d;
    --accent:  #f0883e;
    --green:   #3fb950;
    --red:     #f85149;
    --blue:    #58a6ff;
    --text:    #e6edf3;
    --muted:   #8b949e;
    --radius:  10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', Courier, monospace;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── HEADER ── */
  .header {
    width: 100%;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    gap: 8px;
  }

  .header-title {
    font-size: clamp(11px, 2.5vw, 14px);
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .back-btn {
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--accent);
    border-color: var(--accent);
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .back-btn:hover { background: rgba(240,136,62,.1); }

  /* ── CONTAINER ── */
  .container {
    width: 100%;
    max-width: 600px;
    padding: 16px 12px 32px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* ── PANEL ── */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }

  .panel-label {
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
  }

  /* ── TOAST ── */
  .msg {
    font-size: 12px;
    letter-spacing: 0.04em;
    padding: 9px 12px;
    border-radius: 7px;
    margin-bottom: 12px;
    display: none;
    border: 1px solid transparent;
  }
  .msg.ok    { display: block; background: rgba(63,185,80,.1);  border-color: var(--green); color: var(--green); }
  .msg.error { display: block; background: rgba(248,81,73,.1);  border-color: var(--red);   color: var(--red); }

  /* ── ADD FORM ── */
  .add-form {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 8px;
    align-items: center;
  }

  .add-form input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    padding: 9px 11px;
    outline: none;
    transition: border-color .15s;
    min-width: 0;
  }
  .add-form input::placeholder { color: var(--muted); }
  .add-form input:focus { border-color: var(--accent); }

  .add-btn {
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 9px 16px;
    border-radius: 7px;
    border: 1px solid var(--green);
    background: rgba(63,185,80,.1);
    color: var(--green);
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
    touch-action: manipulation;
  }
  .add-btn:hover  { background: rgba(63,185,80,.2); }
  .add-btn:active { transform: scale(.97); }

  /* ── USER LIST ── */
  .user-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .user-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    gap: 10px;
    transition: border-color .15s;
  }
  .user-item:hover { border-color: #484f58; }

  .user-info { display: flex; align-items: center; gap: 8px; min-width: 0; }

  .user-name {
    font-weight: 700;
    font-size: 13px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .user-role {
    font-size: 10px;
    letter-spacing: 0.08em;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 20px;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .user-role.admin { background: rgba(248,81,73,.15);  color: var(--red);  border: 1px solid rgba(248,81,73,.3); }
  .user-role.user  { background: rgba(88,166,255,.15); color: var(--blue); border: 1px solid rgba(88,166,255,.3); }

  .del-btn {
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    padding: 5px 11px;
    border-radius: 6px;
    border: 1px solid rgba(248,81,73,.4);
    background: rgba(248,81,73,.08);
    color: var(--red);
    cursor: pointer;
    transition: all .15s;
    flex-shrink: 0;
    touch-action: manipulation;
  }
  .del-btn:hover  { background: rgba(248,81,73,.18); border-color: var(--red); }
  .del-btn:active { transform: scale(.96); }

  .no-del {
    font-size: 11px;
    color: var(--border);
    flex-shrink: 0;
  }

  .empty {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 24px 0;
    letter-spacing: 0.05em;
  }

  /* ── MOBILE ── */
  @media (max-width: 420px) {
    .add-form {
      grid-template-columns: 1fr 1fr;
    }
    .add-btn {
      grid-column: 1 / -1;
    }
  }
</style>
</head>
<body>

<div class="header">
  <span class="header-title">👥 Quản lý User</span>
  <button class="back-btn" onclick="goBack()">← Điều khiển</button>
</div>

<div class="container">

  <!-- THÊM USER -->
  <div class="panel">
    <div class="panel-label">Thêm user mới</div>
    <div class="msg" id="msg"></div>
    <div class="add-form">
      <input type="text"     id="newUser" placeholder="Tên đăng nhập" autocomplete="off">
      <input type="password" id="newPass" placeholder="Mật khẩu">
      <button class="add-btn" onclick="addUser()">+ Thêm</button>
    </div>
  </div>

  <!-- DANH SÁCH -->
  <div class="panel">
    <div class="panel-label">Danh sách user</div>
    <div class="user-list" id="userList">
      <div class="empty">Đang tải...</div>
    </div>
  </div>

</div>

<script>
const token = new URLSearchParams(window.location.search).get("token");
if (!token) window.location.href = "/login";

function showMsg(text, type) {
  const el = document.getElementById("msg");
  el.textContent = text;
  el.className = "msg " + type;
  setTimeout(() => el.className = "msg", 3000);
}

async function loadUsers() {
  const res  = await fetch("/api/users", { headers: { "x-token": token } });
  const data = await res.json();
  const list = document.getElementById("userList");

  if (!data.ok || data.users.length === 0) {
    list.innerHTML = '<div class="empty">Chưa có user nào</div>';
    return;
  }

  const allUsers = [{ username: "admin", role: "admin" }, ...data.users];
  list.innerHTML = allUsers.map(u => `
    <div class="user-item">
      <div class="user-info">
        <span class="user-name">👤 ${u.username}</span>
        <span class="user-role ${u.role}">${u.role}</span>
      </div>
      ${u.role !== "admin"
        ? `<button class="del-btn" onclick="deleteUser('${u.username}')">Xóa</button>`
        : `<span class="no-del">Không thể xóa</span>`
      }
    </div>
  `).join("");
}

async function addUser() {
  const username = document.getElementById("newUser").value.trim();
  const password = document.getElementById("newPass").value.trim();
  if (!username || !password) { showMsg("Vui lòng nhập đủ thông tin!", "error"); return; }

  const res  = await fetch("/api/users", {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-token": token },
    body: JSON.stringify({ username, password })
  });
  const data = await res.json();

  if (data.ok) {
    showMsg("✅ Đã thêm user: " + username, "ok");
    document.getElementById("newUser").value = "";
    document.getElementById("newPass").value = "";
    loadUsers();
  } else {
    showMsg("❌ " + data.message, "error");
  }
}

function goBack() {
  window.location.href = "/app?token=" + token;
}

async function deleteUser(username) {
  if (!confirm("Xóa user: " + username + "?")) return;
  const res  = await fetch("/api/users/" + username, {
    method: "DELETE",
    headers: { "x-token": token }
  });
  const data = await res.json();
  if (data.ok) {
    showMsg("✅ Đã xóa: " + username, "ok");
    const items = document.querySelectorAll(".user-item");
    items.forEach(item => {
      if (item.querySelector(".user-name").textContent.trim() === "👤 " + username)
        item.remove();
    });
    const list = document.getElementById("userList");
    if (list.querySelectorAll(".user-item").length === 0)
      list.innerHTML = '<div class="empty">Chưa có user nào</div>';
  } else {
    showMsg("❌ " + data.message, "error");
  }
}

loadUsers();
</script>
</body>
</html>
